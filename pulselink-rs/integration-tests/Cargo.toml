[package]
name = "pulselink-integration-tests"
description = "Integration tests for pulselink-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
pulselink-ble = { workspace = true }
pulselink-core = { workspace = true }
pulselink-pattern = { workspace = true }
pulselink-protocol = {
    workspace = true,
    default-features = false,
    features = [
        "coyote-v2",
        "coyote-v3",
        "opossum",
        "civet",
        "paw-prints"
    ]
}
pulselink-device = { workspace = true }
pulselink-runtime = { workspace = true }
pulselink-transport = { workspace = true, features = ["mock"] }
pulselink-ws = { workspace = true, default-features = false, features = ["mock"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
