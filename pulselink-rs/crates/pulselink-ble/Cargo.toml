[package]
name = "pulselink-ble"
description = "btleplug-based local BLE backend for pulselink-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
pulselink-transport = { workspace = true }
async-trait = { workspace = true }
btleplug = { workspace = true, optional = true }
futures-channel = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = ["btleplug"]
btleplug = ["dep:btleplug"]

[dev-dependencies]
pulselink-core = { workspace = true }
pulselink-protocol = { workspace = true, features = ["coyote-v3"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
targets = []

[lints]
workspace = true

[[example]]
name = "coyote_v3_probe"
required-features = ["btleplug"]
