[package]
name = "pulselink-ws"
description = "DG-LAB V4 WebSocket controller SDK for pulselink-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
pulselink-core = { workspace = true }
pulselink-pattern = { workspace = true }
pulselink-protocol = { workspace = true, default-features = false, features = ["socket-v4"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }

[features]
default = []
mock = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"] }

[package.metadata.docs.rs]
all-features = true
targets = []

[lints]
workspace = true
