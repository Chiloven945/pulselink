[package]
name = "pulselink"
description = "A reliable Rust SDK for DG-LAB devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"

[dependencies]
pulselink-core = { workspace = true }
pulselink-pattern = { workspace = true }
pulselink-protocol = { workspace = true, default-features = false }
pulselink-transport = { workspace = true }
pulselink-runtime = { workspace = true, optional = true }
pulselink-ble = { workspace = true, optional = true, default-features = false }
pulselink-device = { workspace = true, optional = true }
pulselink-ws = { workspace = true, optional = true, default-features = false }
thiserror = { workspace = true }

[features]
default = ["ble"]
protocol = [
    "pulselink-protocol/coyote-v2",
    "pulselink-protocol/coyote-v3",
    "pulselink-protocol/opossum",
    "pulselink-protocol/civet",
    "pulselink-protocol/paw-prints",
    "pulselink-protocol/socket-v4",
]
ble = [
    "dep:pulselink-runtime",
    "dep:pulselink-ble",
    "dep:pulselink-device",
    "pulselink-ble/btleplug",
    "pulselink-protocol/coyote-v3",
]
websocket = ["dep:pulselink-ws", "pulselink-protocol/socket-v4"]
full = ["ble", "websocket"]

[dev-dependencies]
pulselink-transport = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
targets = []

[lints]
workspace = true

[[example]]
name = "ble_scan"
required-features = ["ble"]

[[example]]
name = "coyote_v3_control"
required-features = ["ble"]

[[example]]
name = "ws_pairing"
required-features = ["websocket"]

[[example]]
name = "ws_control"
required-features = ["websocket"]

[[example]]
name = "protocol_only"
required-features = ["protocol"]

[[example]]
name = "coyote_v2_control"
required-features = ["ble"]

[[example]]
name = "opossum_control"
required-features = ["ble"]

[[example]]
name = "civet_pressure"
required-features = ["ble"]

[[example]]
name = "paw_prints_events"
required-features = ["ble"]

[[example]]
name = "v4_typed_devices"
required-features = ["websocket"]
