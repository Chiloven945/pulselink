name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload crates to crates.io"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: pulselink-rs

jobs:
  release:
    name: Rust release
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulselink-rs

      - uses: taiki-e/install-action@cargo-deny

      - name: Preflight
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test --workspace --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          cargo deny check
          ./scripts/check-features.sh
          ./scripts/check-versions.sh
          cargo package --workspace --list
          cargo publish --workspace --dry-run

      - name: Publish crates
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          crates=(
            pulselink-core
            pulselink-transport
            pulselink-pattern
            pulselink-protocol
            pulselink-ble
            pulselink-runtime
            pulselink-ws
            pulselink
          )

          for crate in "${crates[@]}"; do
            echo "::group::publish $crate"
            cargo publish -p "$crate" --locked
            echo "waiting for crates.io index: $crate"
            for attempt in $(seq 1 20); do
              if curl -fsS -A 'pulselink-release-workflow' \
                "https://crates.io/api/v1/crates/$crate" \
                | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["crate"]["max_version"])' \
                | grep -qx '0.1.0'; then
                echo "$crate 0.1.0 is visible"
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "timed out waiting for $crate 0.1.0" >&2
                exit 1
              fi
              sleep 15
            done
            echo "::endgroup::"
          done
