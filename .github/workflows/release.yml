name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually upload crates to crates.io"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: pulselink-rs

jobs:
  release:
    name: Rust release
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulselink-rs

      - uses: taiki-e/install-action@cargo-deny

      - name: Preflight
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-features
          cargo test --workspace --no-default-features
          RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
          cargo deny check
          ./scripts/check-features.sh
          ./scripts/check-versions.sh
          cargo package --workspace --list
          cargo publish --workspace --dry-run

      - name: Publish crates
        if: ${{ inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          echo "workspace version: $version"
          crates=(
            pulselink-core
            pulselink-transport
            pulselink-pattern
            pulselink-protocol
            pulselink-ble
            pulselink-runtime
            pulselink-ws
            pulselink
          )

          for crate in "${crates[@]}"; do
            current=$(curl -fsS -A 'pulselink-release-workflow' \
              "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])' 2>/dev/null || true)
            if [ "$current" = "$version" ]; then
              echo "skip $crate $version (already published)"
              continue
            fi

            echo "::group::publish $crate $version"
            cargo publish -p "$crate" --locked
            echo "waiting for crates.io index: $crate $version"
            for attempt in $(seq 1 40); do
              current=$(curl -fsS -A 'pulselink-release-workflow' \
                "https://crates.io/api/v1/crates/$crate" 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["crate"]["max_version"])' 2>/dev/null || true)
              if [ "$current" = "$version" ]; then
                echo "$crate $version is visible"
                break
              fi
              if [ "$attempt" -eq 40 ]; then
                echo "timed out waiting for $crate $version" >&2
                exit 1
              fi
              sleep 15
            done
            echo "::endgroup::"
          done
